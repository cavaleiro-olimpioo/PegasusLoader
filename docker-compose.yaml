services:
  proxy:
    build: ./proxy
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - node-01
      - node-02
      - node-03
    networks:
      - private
      - public




  node-01:
    build: ./ServerTest
    environment:
      NAME: node-01
    volumes:
      - ./ServerTest/node-01/index.html:/app/index.html:ro
    ports:
      - "3001:3000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    networks:
      - private


  node-02:
    build: ./ServerTest
    environment:
      NAME: node-02
    volumes:
      - ./ServerTest/node-02/index.html:/app/index.html:ro
    ports:
      - "3002:3000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    networks:
      - private

  node-03:
    build: ./ServerTest
    environment:
      NAME: node-03
    volumes:
      - ./ServerTest/node-03/index.html:/app/index.html:ro
    ports:
      - "3003:3000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    networks:
      - private

networks:
  private:
    driver: bridge
    internal: true
    name: private_network
  public:
    driver: bridge
    name: public_network