services:
  node-01:
    build: .
    environment:
      NAME: node-01
    volumes:
      - ./node-01/index.html:/app/index.html:ro
    ports:
      - "3001:3000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m


